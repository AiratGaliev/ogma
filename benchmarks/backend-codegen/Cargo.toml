[package]
name = "ogma-backend-codegen-benchmark"
version = "0.1.0"
edition = "2024"
publish = false
description = "M0 comparison of Cranelift ObjectModule and LLVM over a shared Ogma Core IR workload subset"

[dependencies]
anyhow = "1.0.103"
cranelift-codegen = { version = "0.137.1", features = ["all-native-arch"] }
cranelift-frontend = "0.137.1"
cranelift-module = "0.137.1"
cranelift-native = "0.137.1"
cranelift-object = "0.137.1"
inkwell = { version = "0.11.0", features = ["llvm18-1-prefer-dynamic"] }
libloading = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
target-lexicon = "0.13.5"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
