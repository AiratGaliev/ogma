[package]
name = "ogma-buffer-interop-proof"
version = "0.1.0"
edition = "2021"
publish = false
description = "M0 proof of Ogma JS buffer and Rust ownership interoperability"

[lib]
name = "ogma_buffer_interop_proof"

[[bin]]
name = "ogma-buffer-interop-bench"
path = "src/bin/benchmark.rs"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
