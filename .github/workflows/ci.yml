          persist-credentials: false

      - name: Install LLVM and native linker
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 build-essential

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Record toolchain versions
        run: |
          rustc --version
          cargo --version
          llvm-config-18 --version
          clang-18 --version
          cc --version

      - name: Resolve and capture dependency lock
