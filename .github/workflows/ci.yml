        run: cargo test --manifest-path benchmarks/backend-codegen/Cargo.toml --all-features --locked

      - name: Run reproducible dual-backend benchmark
        run: |
          set -euo pipefail
          cargo run --manifest-path benchmarks/backend-codegen/Cargo.toml --locked --release -- \
            --iterations 50000 --warmups 3 --samples 101 \
            --revision "${{ github.event.pull_request.head.sha }}" \
