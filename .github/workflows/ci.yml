name: CI Fast

on:
  pull_request:
    branches: [dev, test, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, test, main, feat/ogm-30-benchmark-cranelift-llvm]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pull request routing
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BASE_BRANCH" in
            dev)
              case "$HEAD_BRANCH" in
                feat/*|fix/*|refactor/*|test/*|docs/*|chore/*) ;;
                *)
                  echo "::error::Topic PRs to dev must use feat/*, fix/*, refactor/*, test/*, docs/* or chore/*."
                  exit 1
                  ;;
              esac
              ;;
            test)
              if [[ "$HEAD_BRANCH" != "dev" ]]; then
                echo "::error::Only dev may be promoted to test."
                exit 1
              fi
              ;;
            main)
              case "$HEAD_BRANCH" in
                test|hotfix/*) ;;
                *)
                  echo "::error::Only test or an explicitly documented hotfix/* branch may target main."
                  exit 1
                  ;;
              esac
              ;;
          esac

      - name: Validate repository documentation
        run: python .github/scripts/validate_repository.py

      - name: Generate portable bytecode verifier fixtures
        run: python tests/ogmb/build_fixtures.py

      - name: Run repository, verifier and conformance-runner self-tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Verify Core IR v1 contract and fixture corpus
        run: python .github/scripts/verify_core_ir.py --manifest tests/core-ir/manifest.json --report "$RUNNER_TEMP/core-ir-verifier-report.json"

      - name: Upload Core IR verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ir-v1-verifier-report
          path: ${{ runner.temp }}/core-ir-verifier-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify portable .ogmb v1 container and decoder contract
        run: python .github/scripts/verify_ogmb.py --manifest tests/ogmb/.generated/manifest.json --report "$RUNNER_TEMP/ogmb-verifier-report.json"

      - name: Upload OGMB verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogmb-v1-verifier-report
          path: ${{ runner.temp }}/ogmb-verifier-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Compile CI helper scripts
        run: python -m compileall -q .github/scripts tools tests/ogmb/build_fixtures.py

      - name: Set up pinned Node.js reference runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify pinned Node.js reference version
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(cat .node-version)"
          actual="$(node --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Expected Node.js $expected, got $actual."
            exit 1
          fi

      - name: Run Node package-resolution reference fixtures
        run: node tests/node-resolution/run.mjs

      - name: Run Node scheduling reference fixtures
        run: node tests/node-scheduling/run.mjs

      - name: Set up Rust toolchain when a workspace exists
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting, lint and tests
        if: hashFiles('Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Report Rust checks are not applicable yet
        if: hashFiles('Cargo.toml') == ''
        run: echo "::notice::No Cargo.toml is present yet; Rust build, Clippy and tests are not applicable to this documentation/bootstrap repository."

  parser-frontend-benchmark:
    name: OGM-14 parser frontend benchmark
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && startsWith(github.head_ref, 'feat/ogm-14-')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Set up Python for result collection
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run parser frontend benchmark and focused checks
        run: bash benchmarks/parser-frontend/run.sh

      - name: Upload raw measurements, lockfile and environment metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogm-14-parser-frontend-benchmark
          path: |
            benchmarks/parser-frontend/Cargo.lock
            benchmarks/parser-frontend/results/
          if-no-files-found: warn
          retention-days: 30


  value-representation-benchmark:
    name: OGM-17 Value and SSA representation proof
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && startsWith(github.head_ref, 'feat/ogm-17-')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical Core IR benchmark corpus
        run: python .github/scripts/verify_core_ir.py --manifest tests/core-ir/manifest.json --report "$RUNNER_TEMP/ogm-17-core-ir-verifier-report.json"

      - name: Run Value semantic fixtures and Core IR-driven SSA proof
        run: |
          python -m unittest discover -s benchmarks/value-representations -p "test_*.py" -v
          python benchmarks/value-representations/run.py --output "$RUNNER_TEMP/ogm-17-value-ssa-report.json"

      - name: Upload OGM-17 proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogm-17-value-representation-evidence
          path: |
            ${{ runner.temp }}/ogm-17-core-ir-verifier-report.json
            ${{ runner.temp }}/ogm-17-value-ssa-report.json
          if-no-files-found: warn
          retention-days: 30


  native-value-ssa-benchmark:
    name: OGM-38 native Value and SSA representation evidence
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/ogm-38-')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
      CARGO_TARGET_DIR: target-ogm38

    steps:
      - name: Checkout tested PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install LLVM, binutils and native linker
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 build-essential binutils

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify canonical Core IR and OGM-17 semantic baseline
        run: |
          set -euo pipefail
          python .github/scripts/verify_core_ir.py --manifest tests/core-ir/manifest.json --report "$RUNNER_TEMP/ogm38-core-ir-report.json"
          python -m unittest discover -s benchmarks/value-representations -p "test_*.py" -v

      - name: Resolve lockfiles for OGM-26/27 and native backend proofs
        shell: bash
        run: |
          set -euo pipefail
          for crate in gc-comparison native-runtime-boundary backend-codegen; do
            manifest="benchmarks/$crate/Cargo.toml"
            lockfile="benchmarks/$crate/Cargo.lock"
            if [ ! -f "$lockfile" ]; then
              cargo generate-lockfile --manifest-path "$manifest"
            fi
          done

      - name: Check OGM-26/27 and backend formatting
        run: |
          cargo fmt --manifest-path benchmarks/gc-comparison/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/native-runtime-boundary/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/backend-codegen/Cargo.toml --all -- --check

      - name: Run Clippy on GC, native-boundary and backend evidence crates
        run: |
          cargo clippy --manifest-path benchmarks/gc-comparison/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/native-runtime-boundary/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/backend-codegen/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run OGM-26/27 and backend contract tests
        run: |
          cargo test --manifest-path benchmarks/gc-comparison/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/native-runtime-boundary/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/backend-codegen/Cargo.toml --all-features --locked

      - name: Execute four native Value/SSA candidates and collect measurements
        run: |
          set -euo pipefail
          rustc --version
          llvm-config-18 --version
          clang-18 --version
          objdump --version
          cargo run --manifest-path benchmarks/backend-codegen/Cargo.toml --locked --release --bin ogm38-value-ssa -- \
            --iterations 1000 --warmups 3 --samples 101 \
            --revision "${{ github.event.pull_request.head.sha }}" \
            --output "$RUNNER_TEMP/ogm38-native-value-ssa-report.json"
          cp benchmarks/backend-codegen/Cargo.lock "$RUNNER_TEMP/ogm38-Cargo.lock"

      - name: Execute common Core IR portable/native differential proof (OGM-31)
        run: |
          set -euo pipefail
          python -m unittest discover -s benchmarks/dual-backend -p "test_*.py" -v
          python benchmarks/dual-backend/run.py \
            --output "$RUNNER_TEMP/ogm38-dual-backend-report.json" \
            --artifact-dir "$RUNNER_TEMP/ogm38-dual-backend-artifacts" \
            --iterations 1000
          python benchmarks/value-representations/validate_ogm38_ogm31.py \
            --native-report "$RUNNER_TEMP/ogm38-native-value-ssa-report.json" \
            --ogm31-report "$RUNNER_TEMP/ogm38-dual-backend-report.json" \
            --output "$RUNNER_TEMP/ogm38-ogm31-differential-report.json"

      - name: Export and validate committed-format OGM-38 raw evidence
        run: |
          set -euo pipefail
          python benchmarks/value-representations/export_ogm38_raw_samples.py \
            --native-report "$RUNNER_TEMP/ogm38-native-value-ssa-report.json" \
            --differential-report "$RUNNER_TEMP/ogm38-ogm31-differential-report.json" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --artifact-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --output-dir "$RUNNER_TEMP/ogm38-committed-results"

      - name: Upload OGM-38 raw measurements and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogm38-native-value-ssa-evidence
          path: |
            ${{ runner.temp }}/ogm38-core-ir-report.json
            ${{ runner.temp }}/ogm38-native-value-ssa-report.json
            ${{ runner.temp }}/ogm38-dual-backend-report.json
            ${{ runner.temp }}/ogm38-ogm31-differential-report.json
            ${{ runner.temp }}/ogm38-dual-backend-artifacts
            ${{ runner.temp }}/ogm38-Cargo.lock
            ${{ runner.temp }}/ogm38-committed-results
          if-no-files-found: warn
          retention-days: 90

  portable-bytecode-benchmark:
    name: OGM-16 portable bytecode benchmark
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && startsWith(github.head_ref, 'feat/ogm-16-')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Core IR / stack-register equivalence proof and benchmark
        run: |
          python -m unittest discover -s .github/scripts -p "test_portable_bytecode.py" -v
          python benchmarks/portable-bytecode/run.py --iterations 1000 --warmups 3 --compile-rounds 15 --verifier-rounds 15 --measurement-rounds 9

      - name: Upload OGM-16 raw measurements and verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogm-16-portable-bytecode-evidence
          path: |
            benchmarks/portable-bytecode/results/*.json
            benchmarks/portable-bytecode/fixtures/**/*.json
          if-no-files-found: warn
          retention-days: 30

  object-shapes-inline-cache-benchmark:
    name: OGM-18 object shapes and inline-cache proof
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && startsWith(github.head_ref, 'feat/ogm-18-object-shapes-inline-cache')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run object-shape and inline-cache semantic regression tests
        run: python -m unittest discover -s benchmarks/object-shapes-inline-cache -p "test_*.py" -v

      - name: Run OGM-18 throughput and memory proof
        run: python benchmarks/object-shapes-inline-cache/run.py --revision "${{ github.event.pull_request.head.sha || github.sha }}" --tested-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/ogm-18-object-shapes-ic-report.json"

      - name: Upload OGM-18 proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogm-18-object-shapes-inline-cache-evidence
          path: ${{ runner.temp }}/ogm-18-object-shapes-ic-report.json
          if-no-files-found: warn
          retention-days: 30

  ogm19-rust-abi-proof:
    name: OGM-19 versioned Rust ABI proof
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && startsWith(github.head_ref, 'feat/ogm-19-versioned-rust-abi')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Verify Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          echo "rustc_version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/rust-abi/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path benchmarks/rust-abi/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run ABI contract tests
        run: cargo test --manifest-path benchmarks/rust-abi/Cargo.toml --all-features --locked

      - name: Build shared library for C ABI consumer
        run: cargo build --manifest-path benchmarks/rust-abi/Cargo.toml --locked --release --lib

      - name: Compile C11 ABI consumer smoke test
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I benchmarks/rust-abi/include \
            benchmarks/rust-abi/tests/c_abi_smoke.c \
            -L benchmarks/rust-abi/target/release \
            -Wl,-rpath,"$PWD/benchmarks/rust-abi/target/release" \
            -logma_rust_abi_proof \
            -o "$RUNNER_TEMP/ogma-abi-c-smoke"

      - name: Run C11 ABI consumer smoke test
        run: "$RUNNER_TEMP/ogma-abi-c-smoke"

      - name: Run reproducible ABI boundary benchmark
        env:
          RUSTC_VERSION: ${{ steps.rust_toolchain.outputs.rustc_version }}
        run: |
          set -euo pipefail
          cargo run --manifest-path benchmarks/rust-abi/Cargo.toml --locked --release --bin ogma-abi-bench -- \
            --iterations 10000 \
            --warmups 3 \
            --samples 101 \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --tested-revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/ogm-19-rust-abi-report.json"

      - name: Upload OGM-19 proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogm-19-rust-abi-evidence
          path: ${{ runner.temp }}/ogm-19-rust-abi-report.json
          if-no-files-found: error
          retention-days: 30

  ogm20-host-execution-scope-proof:
    name: OGM-20 HostExecutionScope benchmark and contract proof
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && startsWith(github.head_ref, 'feat/ogm-20-owner-thread-host-execution-scope')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Capture toolchain and runner metadata
        id: benchmark_environment
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cpu_model="$(lscpu | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}')"
          if [[ -z "$cpu_model" ]]; then
            cpu_model="$(uname -m)"
          fi
          echo "rustc_version=$(rustc --version)" >> "$GITHUB_OUTPUT"
          echo "cpu_model=$cpu_model" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/host-execution-scope/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path benchmarks/host-execution-scope/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run host execution scope contract tests
        run: cargo test --manifest-path benchmarks/host-execution-scope/Cargo.toml --all-features --locked

      - name: Run reproducible HostExecutionScope comparison
        env:
          RUSTC_VERSION: ${{ steps.benchmark_environment.outputs.rustc_version }}
          OGM20_CPU_MODEL: ${{ steps.benchmark_environment.outputs.cpu_model }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path benchmarks/host-execution-scope/Cargo.toml --locked --release --bin ogma-host-scope-bench -- \
            --iterations 10000 \
            --warmups 3 \
            --samples 101 \
            --revision "${{ github.event.pull_request.head.sha }}" \
            --tested-revision "$GITHUB_SHA" \
            --cpu "$OGM20_CPU_MODEL" \
            --output "$RUNNER_TEMP/ogm-20-host-execution-scope-report.json"

      - name: Validate OGM-20 benchmark JSON report
        run: python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$RUNNER_TEMP/ogm-20-host-execution-scope-report.json"

      - name: Upload OGM-20 proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogm-20-host-execution-scope-evidence
          path: ${{ runner.temp }}/ogm-20-host-execution-scope-report.json
          if-no-files-found: error
          retention-days: 30


  ogm21-typed-host-dispatch-proof:
    name: OGM-21 typed host function dispatch proof
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && startsWith(github.head_ref, 'feat/ogm-21-typed-host-function-dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Capture toolchain and runner metadata
        id: benchmark_environment
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cpu_model="$(lscpu | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}')"
          if [[ -z "$cpu_model" ]]; then
            cpu_model="$(uname -m)"
          fi
          echo "rustc_version=$(rustc --version)" >> "$GITHUB_OUTPUT"
          echo "cpu_model=$cpu_model" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run typed host dispatch contract tests
        run: cargo test --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --all-features --locked

      - name: Compile C11 descriptor and slot layout smoke test
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I benchmarks/typed-host-dispatch/include \
            -I benchmarks/rust-abi/include \
            benchmarks/typed-host-dispatch/tests/c_abi_layout.c \
            -o "$RUNNER_TEMP/ogma-typed-host-dispatch-c-layout"
          "$RUNNER_TEMP/ogma-typed-host-dispatch-c-layout"

      - name: Run reproducible typed host dispatch comparison
        id: benchmark
        env:
          RUSTC_VERSION: ${{ steps.benchmark_environment.outputs.rustc_version }}
          OGM21_CPU_MODEL: ${{ steps.benchmark_environment.outputs.cpu_model }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --locked --release --bin ogma-typed-dispatch-bench -- \
            --iterations 10000 \
            --warmups 3 \
            --samples 101 \
            --revision "${{ github.event.pull_request.head.sha }}" \
            --tested-revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/ogm-21-typed-host-dispatch-report.json"

      - name: Validate OGM-21 benchmark JSON report
        run: python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$RUNNER_TEMP/ogm-21-typed-host-dispatch-report.json"

      - name: Upload OGM-21 proof report
        if: always() && steps.benchmark.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ogm-21-typed-host-dispatch-evidence
          path: ${{ runner.temp }}/ogm-21-typed-host-dispatch-report.json
          if-no-files-found: error
          retention-days: 30


  ogm22-buffer-interop-proof:
    name: OGM-22 buffer ownership and zero-copy proof
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && startsWith(github.head_ref, 'feat/ogm-22-buffer-interop-zero-copy')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Capture toolchain and runner metadata
        id: benchmark_environment
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cpu_model="$(lscpu | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}')"
          if [[ -z "$cpu_model" ]]; then cpu_model="$(uname -m)"; fi
          echo "rustc_version=$(rustc --version)" >> "$GITHUB_OUTPUT"
          echo "cpu_model=$cpu_model" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/buffer-interop/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path benchmarks/buffer-interop/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run buffer ownership and borrow contract tests
        run: cargo test --manifest-path benchmarks/buffer-interop/Cargo.toml --all-features --locked

      - name: Run copy versus zero-copy benchmark
        id: benchmark
        env:
