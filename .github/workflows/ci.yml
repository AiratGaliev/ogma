          set -euo pipefail
          if [ ! -f benchmarks/backend-codegen/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path benchmarks/backend-codegen/Cargo.toml
          fi
          cp benchmarks/backend-codegen/Cargo.lock "$RUNNER_TEMP/ogm30-Cargo.lock"

      - name: Check formatting
