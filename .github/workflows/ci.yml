    permissions:
      contents: read
    env:
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
      CARGO_TARGET_DIR: target-ogm31

    steps:
      - name: Checkout tested PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install LLVM and native linker
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 build-essential

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record toolchain versions and resolve backend lock
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          python --version
          llvm-config-18 --version
          clang-18 --version
          cc --version
          for crate in rust-abi host-execution-scope typed-host-dispatch native-runtime-boundary backend-codegen; do
            manifest="benchmarks/$crate/Cargo.toml"
            lockfile="benchmarks/$crate/Cargo.lock"
            if [ ! -f "$lockfile" ]; then
              cargo generate-lockfile --manifest-path "$manifest"
            fi
            cp "$lockfile" "$RUNNER_TEMP/ogm31-$crate-Cargo.lock"
          done

      - name: Check OGM-19/20/21/27/32 Rust formatting and C ABI layout
        run: |
          cargo fmt --manifest-path benchmarks/rust-abi/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/host-execution-scope/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/native-runtime-boundary/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/backend-codegen/Cargo.toml --all -- --check
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I benchmarks/rust-abi/include -I benchmarks/typed-host-dispatch/include -I benchmarks/backend-codegen/include benchmarks/backend-codegen/tests/aot_abi_layout.c

      - name: Run OGM-19/20/21/27/32 Clippy
        run: |
          cargo clippy --manifest-path benchmarks/rust-abi/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/host-execution-scope/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/native-runtime-boundary/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/backend-codegen/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run OGM-19/20/21/27/32 contract tests
        run: |
          cargo test --manifest-path benchmarks/rust-abi/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/host-execution-scope/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/native-runtime-boundary/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/backend-codegen/Cargo.toml --all-features --locked

      - name: Generate portable bytecode verifier fixtures
        run: python tests/ogmb/build_fixtures.py

      - name: Run portable bytecode verifier and interpreter regressions
        run: |
          python -m unittest discover -s .github/scripts -p "test_ogmb.py" -v
          python -m unittest discover -s .github/scripts -p "test_portable_bytecode.py" -v

      - name: Run OGM-31 portable differential and negative-case tests
        run: python -m unittest discover -s benchmarks/dual-backend -p "test_*.py" -v

      - name: Run same-Core-IR dual-backend proof
        id: proof
        env:
          OGM31_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python benchmarks/dual-backend/run.py \
            --iterations 1000 \
            --output "$RUNNER_TEMP/ogm31-dual-backend-report.json" \
            --artifact-dir "$RUNNER_TEMP/ogm31-artifacts"

      - name: Validate OGM-31/32 proof report acceptance
        run: |
          python3 - "$RUNNER_TEMP/ogm31-dual-backend-report.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              report = json.load(report_file)

          assert report["task"] == "OGM-31"
          assert report["target"] == "x86_64-unknown-linux-gnu"
          assert report["differential_observations"]["all_equal"]
          assert report["negative_cases"]["tampered_ogmb"]["rejected"]
          assert report["unsupported_aot_fallback"]["selected_fallback"] == "portable-register-bytecode-interpreter"
          assert all(report["acceptance"].values())
          assert set(report["native_backends"]) == {"cranelift", "llvm"}
          required_features = (1 << 0) | (1 << 1) | (1 << 2) | (1 << 3) | (1 << 4) | (1 << 63)
          for backend in report["native_backends"].values():
              assert backend["native_object"]["bytes"] > 0
              assert backend["native_object"]["format"] == "ELF relocatable object (.o)"
              assert all(int(value) > 0 for value in backend["runtime_helper_calls"].values())
              integration = backend["runtime_integration"]
              assert integration["ogm19_abi_v1_negotiated"]
              assert (integration["ogm19_version"]["features"] & required_features) == required_features
              assert len(integration["ogm19_callback_trace"]) == 5
              assert integration["ogm27_model"]["callback_invocations"] >= 5
              assert integration["ogm27_model"]["execution_budget"]["max_unpolled_work"] == 64
              assert (integration["ogm19_completions"]["dynamic_add_normal"]["kind"],
                      integration["ogm19_completions"]["dynamic_add_normal"]["payload"]) == (0, 15)
              assert (integration["ogm19_completions"]["dynamic_add_throw"]["kind"],
                      integration["ogm19_completions"]["dynamic_add_throw"]["payload"]) == (1, -(1 << 63))
              assert (integration["ogm19_completions"]["host_echo_normal"]["kind"],
                      integration["ogm19_completions"]["host_echo_normal"]["payload"]) == (0, 42)
              assert (integration["ogm19_completions"]["host_echo_throw"]["kind"],
                      integration["ogm19_completions"]["host_echo_throw"]["payload"]) == (1, -7)
              assert all(value > 0 for value in integration["ogm27_native_safepoints"].values())
              model = integration["ogm27_model"]
              assert model["native_shadow_frame"]["active_during_execution"]
              assert model["native_shadow_frame"]["live_managed_root_survived_every_collection"]
              assert model["execution_budget"]["polls"] >= 5
              assert ["Native", "Interpreter", "HostCallback"] in model["completion_transition_paths"]
              aot = integration["ogm32_aot_host_calls"]
              assert aot["aot_abi_v1_validated"]
              assert aot["interpreter_reference"]["typed"] == {"kind": "normal", "value": 42}
              assert aot["interpreter_reference"]["generic"] == {"kind": "normal", "value": 42}
              assert aot["interpreter_reference"]["throw"] == {"kind": "throw", "value": -7}
              assert aot["generic_throw_error_kind"] == 4
              assert aot["signature_mismatch_error_kind"] == 1
              assert aot["capability_denial_details"] == 1
              assert aot["abi_mismatch_status"] == 2
              assert aot["cancellation_error_kind"] == 5
              assert aot["generic_callbacks"] == 7
              assert aot["nested_callbacks"] == 2
              assert aot["dispatch_counts"] == {
                  "typed_calls": 4,
                  "generic_calls": 4,
                  "handle_calls": 3,
              }
              assert aot["opaque_roots"]["safepoint_checks"] == 18
              assert aot["opaque_roots"]["number_handles_survived_collection"]
          assert len(report["portable_bytecode"]["register_artifacts"]) == 5
          print("Validated OGM-31 portable/native differential, OGM-19 ABI completions, OGM-27 roots/safepoints/budget and OGM-32 versioned AOT host dispatch.")
          PY

      - name: Upload OGM-31 proof report and compiled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogm31-dual-backend-execution-proof
          path: |
            ${{ runner.temp }}/ogm31-dual-backend-report.json
            ${{ runner.temp }}/ogm31-artifacts/**
            ${{ runner.temp }}/ogm31-rust-abi-Cargo.lock
            ${{ runner.temp }}/ogm31-native-runtime-boundary-Cargo.lock
            ${{ runner.temp }}/ogm31-backend-codegen-Cargo.lock
            ${{ runner.temp }}/ogm31-host-execution-scope-Cargo.lock
            ${{ runner.temp }}/ogm31-typed-host-dispatch-Cargo.lock
          if-no-files-found: warn
          retention-days: 90


  ogm29-interpreter-hybrid-footprint:
    name: OGM-29 interpreter and hybrid-native footprint baseline
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/ogm-29-interpreter-hybrid-footprint')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
      CARGO_TARGET_DIR: target-ogm29-ci

    steps:
      - name: Checkout tested PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install LLVM 18 and native linker
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev llvm-18 clang-18 build-essential time

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture benchmark revision and toolchain
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          echo "source_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          rustc --version
          cargo --version
          python --version
          llvm-config-18 --version
          clang-18 --version
          cc --version
          uname -a
          lscpu

      - name: Validate OGM-29 profile and fixture contracts
        run: |
          python3 .github/scripts/validate_runtime_profiles.py --report "$RUNNER_TEMP/ogm29-runtime-profile-contract.json"
          python3 .github/scripts/verify_core_ir.py \
            --manifest tests/core-ir/manifest.json \
            --report "$RUNNER_TEMP/ogm29-core-ir-report.json"

      - name: Check formatting and C ABI layout for native proof dependencies
        run: |
          cargo fmt --manifest-path benchmarks/rust-abi/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/host-execution-scope/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/native-runtime-boundary/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/backend-codegen/Cargo.toml --all -- --check
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -I benchmarks/rust-abi/include \
            -I benchmarks/typed-host-dispatch/include \
            -I benchmarks/backend-codegen/include \
            benchmarks/backend-codegen/tests/aot_abi_layout.c

      - name: Run Clippy for native proof dependencies
        run: |
          cargo clippy --manifest-path benchmarks/rust-abi/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/host-execution-scope/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/native-runtime-boundary/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path benchmarks/backend-codegen/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run native proof contract tests
        run: |
          cargo test --manifest-path benchmarks/rust-abi/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/host-execution-scope/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/typed-host-dispatch/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/native-runtime-boundary/Cargo.toml --all-features --locked
          cargo test --manifest-path benchmarks/backend-codegen/Cargo.toml --all-features --locked

      - name: Run portable bytecode and dual-backend regressions
        run: |
          python tests/ogmb/build_fixtures.py
          python -m unittest discover -s .github/scripts -p "test_ogmb.py" -v
          python -m unittest discover -s .github/scripts -p "test_portable_bytecode.py" -v
          python -m unittest discover -s benchmarks/dual-backend -p "test_*.py" -v

      - name: Run OGM-29 footprint harness tests
        run: python -m unittest discover -s benchmarks/runtime-footprint -p "test_*.py" -v

      - name: Run OGM-29 interpreter and hybrid-AOT measurements
        env:
          OGM29_SOURCE_REVISION: ${{ steps.environment.outputs.source_sha }}
        run: |
          set -euo pipefail
          python benchmarks/runtime-footprint/run.py \
            --iterations 1000 \
            --warmups 3 \
            --samples 101 \
            --revision "$OGM29_SOURCE_REVISION" \
            --output "$RUNNER_TEMP/ogm29-footprint-report.json" \
            --artifact-dir "$RUNNER_TEMP/ogm29-footprint-artifacts"

      - name: Validate OGM-29 machine-readable footprint evidence
        run: |
          python3 - "$RUNNER_TEMP/ogm29-footprint-report.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)

          assert report["schema"] == "ogma.runtime-footprint-report"
          assert report["version"] == "1.0.0"
          assert report["task"] == "OGM-29"
          assert report["environment"]["target"] == "x86_64-unknown-linux-gnu"
          assert report["workload"]["same_workload_for_portable_and_native"]
          assert len(report["workload"]["fixture_set"]) == 5
          assert all(report["acceptance"].values())
          assert report["proof_measurements"]["portable_interpreter_profile"]["portable_differential"]["same_stack_and_register_observations"]
          assert set(report["proof_measurements"]["hybrid_native_profile"]["backends"]) == {"cranelift", "llvm"}
          for backend in report["proof_measurements"]["hybrid_native_profile"]["backends"].values():
              assert backend["compile_time"]["sample_count"] == 101
              assert backend["link_time"]["sample_count"] == 101
              assert backend["object_bytes"] > 0
              assert backend["copied_native_object"]["bytes"] > 0
          portable_startup = report["startup_and_memory"]["portable_proof_worker_startup"]["latency"]
          native_startup = report["startup_and_memory"]["native_proof_tool_startup"]["latency"]
          assert portable_startup["sample_count"] == 101
          assert native_startup["sample_count"] == 101
          assert portable_startup["p50_ns"] > 0
          assert native_startup["p50_ns"] > 0
          assert report["startup_and_memory"]["portable_proof_worker_peak_rss_bytes"] > 0
          assert report["startup_and_memory"]["native_compiler_and_proof_process_peak_rss_bytes"] > 0
          assert report["production_metric_status"]["runtime_startup"] == "not_implemented"
          assert report["production_metric_status"]["production_runtime_binary_size"] == "not_implemented"
          assert report["production_metric_status"]["production_runtime_peak_rss"] == "not_implemented"
          print("Validated OGM-29 shared-workload footprint report, bytecode/AOT compile samples, artifacts, RSS boundaries and explicit M0 production limitations.")
          PY

      - name: Upload OGM-29 footprint report and raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogm29-interpreter-hybrid-footprint
          path: |
            ${{ runner.temp }}/ogm29-footprint-report.json
            ${{ runner.temp }}/ogm29-runtime-profile-contract.json
            ${{ runner.temp }}/ogm29-core-ir-report.json
            ${{ runner.temp }}/ogm29-footprint-artifacts/ogm30-native-backend-report.json
            ${{ runner.temp }}/ogm29-footprint-artifacts/native-process-time.txt
            ${{ runner.temp }}/ogm29-footprint-artifacts/native/*.o
            ${{ runner.temp }}/ogm29-footprint-artifacts/portable/**/*.ogmb
            ${{ runner.temp }}/ogm29-footprint-artifacts/cargo-target/release/ogma-backend-codegen-benchmark
            benchmarks/backend-codegen/Cargo.lock
          if-no-files-found: warn
          retention-days: 90
