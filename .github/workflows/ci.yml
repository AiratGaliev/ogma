    permissions:
      contents: read
    env:
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
      CARGO_TARGET_DIR: target-ogm30

    steps:
      - name: Checkout tested PR head
        uses: actions/checkout@v4
        with:
